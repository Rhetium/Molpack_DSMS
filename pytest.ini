[pytest]
# Raíz del repo en sys.path para poder importar el paquete `app`.
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Los tests futuros con BD usarán async; modo auto evita decorar cada uno.
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
