# =============================================================
# Molpack DSMS — terminacion TLS.
#
# Se monta en /etc/nginx/conf.d/default.conf dentro del contenedor nginx
# (perfil "tls" de docker-compose.yml). Certificados en /etc/nginx/certs.
#
# No hay reescritura de rutas: la SPA y la API salen del mismo proceso y
# comparten origen, asi que esto es un proxy_pass directo mas TLS y cabeceras.
# =============================================================

# Todo lo que entre por HTTP se manda al 443. Ningun formulario de login
# deberia poder enviarse en claro por haber tecleado la URL sin https.
server {
    listen 80;
    server_name mksvx64lnn10.molpack.org 172.21.5.74 _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mksvx64lnn10.molpack.org 172.21.5.74 _;

    ssl_certificate     /etc/nginx/certs/dsms.crt;
    ssl_certificate_key /etc/nginx/certs/dsms.key;

    # TLS 1.2 como piso: 1.0/1.1 estan retirados y ningun navegador vigente
    # los necesita, ni siquiera en intranet.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- Cabeceras de seguridad ----

    # HSTS: dejar comentado mientras el certificado sea autofirmado. Una vez
    # que el navegador registra HSTS para este host, Chrome y Edge dejan de
    # ofrecer el "continuar de todos modos" ante un certificado no confiable
    # y el sistema queda inaccesible. Descomentar recien cuando el certificado
    # lo emita la CA interna de Molpack y este distribuido por GPO.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # CSP: el JWT vive en localStorage, o sea al alcance de cualquier script
    # inyectado; "script-src 'self'" es la barrera que impide que ese script
    # llegue a ejecutarse. Notas sobre las excepciones:
    #   style-src 'unsafe-inline' -> la SPA usa atributos style= en linea
    #   img-src blob:             -> las imagenes de ficha se descargan con
    #                                Axios y se muestran como object URL
    #   connect-src 'self'        -> la API es del mismo origen; nada sale afuera
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # El limite del backend para imagenes es 5 MB (MAX_FILE_SIZE); este margen
    # deja que el rechazo lo de la app con su mensaje y no nginx con un 413 seco.
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # El rate limiter de login cuenta por IP. Sin esta cabecera todos los
        # intentos del edificio se suman contra la IP de nginx y el bloqueo de
        # 5 minutos cae sobre todos los usuarios a la vez.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # La exportacion a PDF de una ficha con imagenes puede pasar del minuto.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
