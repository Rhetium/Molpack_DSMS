# =============================================================
# Molpack DSMS — despliegue en contenedores.
#
#   Sin TLS (solo pruebas):  docker compose up -d --build
#   Con TLS (produccion):    docker compose --profile tls up -d --build
#
# El perfil "tls" agrega nginx delante y termina HTTPS en el 443. En ese modo
# hay que poner APP_BIND=127.0.0.1 en .env para que el 8000 en claro deje de
# ser alcanzable desde la red y solo quede para depurar desde el propio host.
#
# Las variables se leen del archivo .env (ver .env.example).
# =============================================================

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Se ejecuta una unica vez, cuando el volumen esta vacio: crea las
      # extensiones (pgcrypto, vector), las tablas y el indice HNSW.
      - ./scripts/schema_clean.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Sin `ports`: la base solo es accesible desde la red interna de Compose.
    # Para administrarla desde tu equipo, usar tunel SSH contra el host.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Sobrescriben lo que traiga .env: dentro de Compose la base se
      # resuelve por el nombre del servicio, no por localhost.
      DB_HOST: db
      DB_PORT: "5432"
      # Nombre completo del modelo que quedo cacheado en la imagen.
      EMBEDDING_MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2
      # De quien acepta uvicorn un X-Forwarded-For. Con el perfil tls, nginx
      # llega desde la red interna de Compose (IP dinamica), de ahi el "*":
      # es seguro porque con APP_BIND=127.0.0.1 nadie mas puede hablarle.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      # APP_BIND=127.0.0.1 con el perfil tls (solo loopback, nginx publica el
      # 443); 0.0.0.0 sin el, que deja la app en HTTP plano sobre la LAN.
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8000}:8000"
    volumes:
      # Imagenes subidas por los usuarios: dato de negocio, incluir en backups.
      - ./uploads:/app/uploads
      # Modelos Isolation Forest entrenados (regenerables desde la app).
      - mlmodels:/app/app/ml_models

  # Solo se levanta con --profile tls. Termina HTTPS y agrega las cabeceras de
  # seguridad; no reescribe rutas, porque la SPA y la API comparten origen.
  nginx:
    profiles: ["tls"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/dsms.conf:/etc/nginx/conf.d/default.conf:ro
      # Esperados dentro: dsms.crt y dsms.key (ver deploy/certs/README.md).
      - ./deploy/certs:/etc/nginx/certs:ro

volumes:
  pgdata:
  mlmodels:

# =============================================================
# Red del proyecto con subred FIJA.
#
# Librado a su criterio, Docker toma direcciones del rango
# 172.17.0.0/16 - 172.31.0.0/16. Ese pool CONTIENE las redes
# corporativas de Molpack (172.17, 172.20 y 172.21), asi que una
# red de contenedores puede secuestrar el trafico que debia salir
# por la LAN y dejar el servidor incomunicado: fue lo que corto el
# SSH en el primer intento de despliegue.
#
# De ahi que la subred se fije explicitamente fuera de ese espacio.
# OJO: 192.168.22.0/24 tambien es corporativa. No usarla.
#
# Esto solo cubre la red que crea este compose. El bridge por
# defecto (docker0, 172.17.0.1/16) se corrige en el demonio:
# ver deploy/daemon.json.ejemplo (requiere root).
# =============================================================
networks:
  default:
    ipam:
      config:
        - subnet: 192.168.240.0/24
